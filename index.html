<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Evan's Daily Joys</title>
  <meta name="description" content="Seven little daily games, one for each day of the week.">
  <meta name="theme-color" content="#f6ecd6">
  <link rel="icon" href="assets/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/PixelifySans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <script type="module" src="js/home.js"></script>
</head>
<body>
  <main class="app home">
    <h1 class="title"><span>Evan's</span> <span>Daily Joys</span></h1>

    <section class="calendar pixel-box" data-calendar aria-label="Puzzle calendar">
      <div class="calendar__head">
        <button class="icon-btn" type="button" data-calendar-prev aria-label="Previous month"><img alt=""></button>
        <h2 class="calendar__title" data-calendar-title aria-live="polite"></h2>
        <button class="icon-btn" type="button" data-calendar-next aria-label="Next month"><img alt=""></button>
      </div>
      <div class="calendar__weekdays" data-calendar-weekdays aria-hidden="true"></div>
      <ol class="calendar__grid" data-calendar-grid></ol>
    </section>

    <a class="pixel-btn play-btn" href="play.html">Play</a>

    <!-- Only shown while LOCK_FUTURE_DAYS is off (testing). See js/home.js. -->
    <button class="reset-btn" type="button" data-reset hidden>Reset progress</button>
  </main>
</body>
</html>
